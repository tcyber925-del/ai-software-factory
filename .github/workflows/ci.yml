name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Validate JSON schemas
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = 'schemas';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
          if (files.length < 5) throw new Error('Expected protocol schemas are missing');
          const expected = [
            'work-unit.schema.json',
            'worker.schema.json',
            'capability.schema.json',
            'workspace.schema.json',
            'verification-result.schema.json',
            'integration-result.schema.json',
            'execution-event.schema.json',
            'conflict.schema.json',
          ];
          for (const required of expected) {
            if (!files.includes(required)) {
              throw new Error('Missing protocol schema: ' + required);
            }
          }
          for (const file of files) {
            const data = JSON.parse(fs.readFileSync(dir + '/' + file, 'utf8'));
            if (!data.$schema || !data.title || data.type !== 'object') {
              throw new Error('Invalid schema contract: ' + file);
            }
            if (data.additionalProperties !== false) {
              throw new Error('Schema must reject unknown fields: ' + file);
            }
          }
          console.log('Validated', files.length, 'schemas');
          NODE
      - name: Validate required documentation
        run: |
          test -f AGENTS.md
          test -f README.md
          test -f docs/architecture.md
          test -f docs/protocols.md
          test -f docs/schemas.md
          test -f docs/runtime-adapters.md
          test -f docs/security.md
          test -f docs/execution.md
          test -f docs/provenance.md
          test -f docs/scheduling.md
          test -f docs/repair.md
          test -f docs/doctor.md
